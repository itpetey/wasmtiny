name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run clippy
        run: cargo clippy -- -D warnings

      - name: Run tests
        run: cargo test

      # Stage 2 of host-region-wait-notify: the emission conformance tests
      # are gated behind the feature; run them on platforms where the
      # backends are compiled in (Linux; Windows/FreeBSD would need a
      # runner). macOS correctly compiles to a no-op even with the feature.
      - name: Run tests with platform wake emission
        if: runner.os == 'Linux'
        run: cargo test --features platform-wake-emission

      - name: Clippy with platform wake emission
        if: runner.os == 'Linux'
        run: cargo clippy --features platform-wake-emission -- -D warnings
